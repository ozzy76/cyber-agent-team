[project]
name = "bateam"
version = "0.1.0"
description = "BATeam — multi-agent ADK team for vCISO / vCIO / VC due-diligence engagements"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.31.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bateam"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
